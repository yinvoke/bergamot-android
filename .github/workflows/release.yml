name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Test + build AAR
        run: ./gradlew :bergamot:test :bergamot:assembleRelease
      - name: Version the artifact
        run: cp bergamot/build/outputs/aar/bergamot-release.aar "bergamot-${GITHUB_REF_NAME}.aar"
      - uses: softprops/action-gh-release@v2
        with:
          files: bergamot-*.aar
          generate_release_notes: true
